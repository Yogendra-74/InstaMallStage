# ---------- Permissions pre-granted right after each app session starts
# (both apps below alike — see BaseTest.startSession()) ----------
# Comma-separated "mobile: setPermission" service names, each set to
# "yes" — "Allowed While Using This App" for location, no prompt at all
# for the rest. Without this, the app's own permission alerts appear on
# first launch and, left unanswered, sit on screen indefinitely (they
# belong to springboard, not the app under test), silently blocking every
# element lookup on every screen after them and failing the script.
# App Tracking Transparency is NOT one of these — iOS reserves that one
# from automated granting regardless, so it still needs a real tap (see
# SystemAlerts.allowTracking() / grantAnyShowingNow()).
autoGrantedPermissions=location,notifications,camera,photos

